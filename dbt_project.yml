name: 'dbt_ga4_portfolio'
version: '1.0.0'

# Must match the top-level key in ~/.dbt/profiles.yml (kept out of the repo).
profile: 'dbt_ga4_portfolio'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Default materialization per layer. Individual models can override with {{ config(...) }}.
models:
  dbt_ga4_portfolio:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
